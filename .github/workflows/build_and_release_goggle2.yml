name: Build Google2 Firmware

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Firmware
        run: |
          bash setup.sh automated_build
          make -C build_goggle2

      - name: Get Firmware Name
        id: vars
        run: echo "firmware_name=$(basename build_goggle2/out/*bin)" >> $GITHUB_ENV

      - name: Upload Firmware Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.firmware_name }}
          path: build_goggle2/out/${{ env.firmware_name }}

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: HDZGOGGLE
          path: build_goggle2/out/HDZGOGGLE

      - name: Publish to fr0g-builds (fr0gOS)
        if: github.event_name == 'push'
        run: |
          mkdir -p pub && cp build_goggle2/out/HDZGOGGLE pub/ && cp misc/fr0g/develop.sh pub/
          cp build_goggle2/out/*.bin pub/ 2>/dev/null || true
          cd pub
          git init -q -b fr0g-builds
          git config user.name "fr0g-builds"
          git config user.email "builds@users.noreply.github.com"
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git add -A
          git commit -qm "goggle2 build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" fr0g-builds

      - name: Create Release
        uses: softprops/action-gh-release@v0.1.15
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build_goggle2/out/${{ env.firmware_name }}
          draft: true
